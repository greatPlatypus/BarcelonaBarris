<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barris de Barcelona — Neighbourhood Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16283a;
    --ink-soft:#3c5064;
    --paper:#eee7d8;
    --panel:#f8f4ea;
    --line:#d8cfb8;
    --barri-fill:#d7cdb6;
    --barri-hover:#c7bb9e;
    --barri-stroke:rgba(22,40,58,0.30);
    --district-stroke:#16283a;
    --selected:#e2a730;
    --selected-dark:#a97918;
    --correct:#2f7f56;
    --correct-dark:#1f5c3d;
    --wrong:#bc4436;
    --teal:#1f6f78;
    --teal-dark:#154f56;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
  }
  .app{
    max-width:1280px;
    margin:0 auto;
    padding:28px 24px 40px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
  }
  .header-controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .lang-select{
    border:1px solid var(--ink-soft);
    border-radius:4px;
    background:var(--panel);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:8px 8px;
    cursor:pointer;
    height:38px;
  }
  .lang-select:hover{ background:var(--barri-hover); }
  header.top h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,4vw,40px);
    margin:0;
    letter-spacing:-0.01em;
  }
  header.top h1 em{
    font-style:italic;
    color:var(--teal);
  }

  .mode-nav{
    position:relative;
  }
  .mode-tabs-wrapper{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .burger-btn{
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:5px;
    width:42px;
    height:38px;
    border:1px solid var(--ink-soft);
    border-radius:4px;
    background:var(--panel);
    cursor:pointer;
    padding:0;
  }
  .burger-btn span{
    display:block;
    width:20px;
    height:2px;
    background:var(--ink);
    border-radius:1px;
  }
  .burger-btn:hover{ background:var(--barri-hover); }

  .mode-tab-group{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .mode-tab-group-label{
    font-family:'Fraunces',serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.04em;
    white-space:nowrap;
    width:140px;
    flex:0 0 auto;
  }
  .mode-tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    flex:1;
    border-bottom:1px solid var(--line);
  }
  .mode-tab{
    background:none;
    border:none;
    border-bottom:3px solid transparent;
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--ink-soft);
    padding:10px 4px 9px;
    cursor:pointer;
  }
  .mode-tab:hover{ color:var(--ink); }
  .mode-tab.active{ color:var(--ink); border-bottom-color:var(--teal); }

  .mode-panel{ display:flex; flex-direction:column; gap:18px; }
  .mode-panel[hidden]{ display:none; }

  .mode-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .mode-desc{
    font-size:13.5px;
    color:var(--ink-soft);
    max-width:56ch;
  }
  .scoreboard{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:15px;
    color:var(--ink-soft);
    flex-wrap:wrap;
  }
  .scoreboard .count{
    font-family:'Fraunces',serif;
    font-size:22px;
    font-weight:700;
    color:var(--ink);
    white-space:nowrap;
  }
  .scoreboard .count span.slash{
    color:var(--ink-soft);
    font-weight:400;
    margin:0 2px;
  }
  .scoreboard .count.errors{
    color:var(--ink-soft);
  }
  .scoreboard .count.errors span.error-num{
    font-family:'Fraunces',serif;
    font-size:22px;
    font-weight:700;
    color:var(--wrong);
  }
  button.reset-btn{
    background:none;
    border:1px solid var(--ink-soft);
    color:var(--ink-soft);
    font-family:'Work Sans',sans-serif;
    font-size:13px;
    padding:6px 12px;
    border-radius:3px;
    cursor:pointer;
    white-space:nowrap;
  }
  button.reset-btn:hover{ border-color:var(--ink); color:var(--ink); }

  main.layout{
    display:grid;
    grid-template-columns:minmax(0,1.55fr) minmax(280px,0.85fr);
    gap:22px;
    align-items:start;
  }
  @media (max-width:880px){
    main.layout{ grid-template-columns:1fr; }

    .burger-btn{ display:flex; }
    .mode-tabs-wrapper{
      display:none;
      position:absolute;
      top:calc(100% + 8px);
      left:0;
      right:0;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:6px;
      padding:14px;
      box-shadow:0 8px 20px rgba(0,0,0,0.18);
      z-index:30;
    }
    .mode-tabs-wrapper.open{ display:flex; }
    .mode-tab-group{ flex-direction:column; align-items:stretch; gap:6px; }
    .mode-tab-group-label{ width:auto; }
    .mode-tabs{
      flex-direction:column;
      gap:4px;
      border-bottom:none;
    }
    .mode-tab{
      width:100%;
      text-align:left;
      padding:9px 10px;
      border-bottom:none;
      border-radius:4px;
    }
    .mode-tab:hover{ background:var(--line); color:var(--ink); }
    .mode-tab.active{ background:var(--teal); color:#fff; }
  }

  .map-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    position:relative;
    overflow:hidden;
  }
  .map-toolbar{
    position:absolute;
    top:12px;
    right:12px;
    z-index:5;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .map-toolbar button{
    width:32px;height:32px;
    border-radius:3px;
    border:1px solid var(--ink-soft);
    background:var(--panel);
    color:var(--ink);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    font-family:'Work Sans',sans-serif;
  }
  .map-toolbar button:hover{ background:var(--barri-hover); }

  svg.map{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio: var(--asp);
    touch-action:none;
    cursor:grab;
  }
  svg.map.dragging{ cursor:grabbing; }

  path.barri{
    fill:var(--barri-fill);
    stroke:var(--barri-stroke);
    stroke-width:0.8;
    cursor:pointer;
    transition:fill 120ms ease;
    vector-effect:non-scaling-stroke;
  }
  path.barri:hover:not(.solved){ fill:var(--barri-hover); }
  path.barri.selected{ fill:var(--selected); stroke:var(--selected-dark); }
  path.barri.solved{ fill:var(--correct); cursor:default; stroke:var(--correct-dark); }
  path.barri.wrong-flash{ animation:flashWrong 480ms ease; }
  .medium-map path.barri{ cursor:default; }
  @keyframes flashWrong{
    0%,100%{ filter:none; }
    30%{ filter:brightness(0.85) saturate(1.4); }
  }

  path.district{
    fill:none;
    stroke:var(--district-stroke);
    stroke-width:2.4;
    stroke-linejoin:round;
    pointer-events:none;
    vector-effect:non-scaling-stroke;
  }

  .map-footer-note{
    position:absolute;
    left:12px;
    bottom:10px;
    font-size:12px;
    color:var(--ink-soft);
    background:rgba(248,244,234,0.85);
    padding:2px 8px;
    border-radius:3px;
    pointer-events:none;
  }

  .message{
    position:absolute;
    left:50%;
    top:14px;
    transform:translateX(-50%);
    z-index:6;
    padding:9px 18px;
    border-radius:4px;
    font-size:14px;
    font-weight:600;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
    opacity:0;
    pointer-events:none;
    transition:opacity 180ms ease, transform 180ms ease;
  }
  .message.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .message.wrong{ background:var(--wrong); color:#fff; }
  .message.correct{ background:var(--correct); color:#fff; }
  .message.info{ background:var(--ink); color:#fff; }

  .list-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    display:flex;
    flex-direction:column;
    max-height:min(720px, 78vh);
  }
  .list-panel-header{
    padding:14px 16px 10px;
    border-bottom:1px solid var(--line);
  }
  .list-panel-header h2{
    margin:0 0 8px;
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:600;
  }
  .filter-input{
    width:100%;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    font-family:'Work Sans',sans-serif;
    font-size:13.5px;
    background:#fff;
    color:var(--ink);
  }
  .filter-input:focus{ outline:2px solid var(--teal); outline-offset:1px; }

  .action-bar{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:8px;
    margin-top:10px;
  }
  .hint-text{
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
  }
  .submit-btn{
    background:var(--teal);
    color:#fff;
    border:none;
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:12px 20px;
    border-radius:4px;
    cursor:pointer;
    width:100%;
    transition:background 120ms ease, transform 120ms ease;
  }
  .submit-btn:hover:not(:disabled){ background:var(--teal-dark); }
  .submit-btn:disabled{ background:#c9c2ae; color:#8a8370; cursor:not-allowed; }
  .submit-btn:active:not(:disabled){ transform:scale(0.98); }

  .names-list{
    overflow-y:auto;
    padding:10px 10px 14px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .name-btn{
    text-align:left;
    background:none;
    border:1px solid transparent;
    border-radius:3px;
    padding:7px 10px;
    font-family:'Work Sans',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
  }
  .name-btn:hover:not(:disabled){ background:var(--line); }
  .name-btn.selected{ background:var(--selected); border-color:var(--selected-dark); color:var(--ink); font-weight:600; }
  .name-btn.solved{ background:none; color:var(--correct-dark); font-weight:600; cursor:default; }
  .name-btn:disabled{ cursor:default; }
  .name-btn.hidden-filter{ display:none; }
  .names-list.readonly .name-btn{ cursor:default; }
  .names-list.readonly .name-btn:hover:not(.selected):not(.solved){ background:none; }

  .completion-banner{
    display:none;
    background:var(--correct);
    color:#fff;
    padding:14px 18px;
    border-radius:4px;
    font-family:'Fraunces',serif;
    font-size:17px;
    text-align:center;
  }
  .completion-banner.show{ display:block; }

</style>
</head>
<body>
<div class="app">
  <div class="mode-nav">
    <header class="top">
      <h1 id="appTitle">Barris de <em>Barcelona</em></h1>
      <div class="header-controls">
        <select id="langSelect" class="lang-select" aria-label="Language">
          <option value="ca">CAT</option>
          <option value="en" selected>EN</option>
          <option value="es">ES</option>
          <option value="fr">FR</option>
        </select>
        <button class="burger-btn" type="button" id="burgerBtn" aria-label="Toggle game modes" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <div class="mode-tabs-wrapper" id="modeTabsWrapper">
  <div class="mode-tab-group">
    <span class="mode-tab-group-label" data-i18n="groupBarris"></span>
    <nav class="mode-tabs">
      <button class="mode-tab active" type="button" data-mode="easy" data-i18n="tabEasy"></button>
      <button class="mode-tab" type="button" data-mode="medium" data-i18n="tabFindNameMedium"></button>
      <button class="mode-tab" type="button" data-mode="location" data-i18n="tabFindLocationMedium"></button>
      <button class="mode-tab" type="button" data-mode="hard-name" data-i18n="tabFindNameHard"></button>
      <button class="mode-tab" type="button" data-mode="hard-location" data-i18n="tabFindLocationHard"></button>
    </nav>
  </div>
  <div class="mode-tab-group">
    <span class="mode-tab-group-label" data-i18n="groupDistricts"></span>
    <nav class="mode-tabs">
      <button class="mode-tab" type="button" data-mode="district-easy" data-i18n="tabEasy"></button>
      <button class="mode-tab" type="button" data-mode="district-medium" data-i18n="tabFindNameMedium"></button>
      <button class="mode-tab" type="button" data-mode="district-location" data-i18n="tabFindLocationMedium"></button>
      <button class="mode-tab" type="button" data-mode="district-hard-name" data-i18n="tabFindNameHard"></button>
      <button class="mode-tab" type="button" data-mode="district-hard-location" data-i18n="tabFindLocationHard"></button>
    </nav>
  </div>
    </div>
  </div>

  <section class="mode-panel" id="panel-easy">
    <div class="mode-header">
      <div class="mode-desc" data-i18n="descEasyBarri"></div>
      <div class="scoreboard">
        <div class="count"><span class="score-count">0</span><span class="slash">/</span><span class="score-total">73</span> <span data-i18n="placedLabel"></span></div>
        <div class="count errors"><span class="error-num">0</span> <span class="error-word"></span></div>
        <button class="reset-btn" type="button" data-reset="easy" data-i18n="resetProgressBtn"></button>
      </div>
    </div>

    <div class="completion-banner" data-banner="easy"></div>

    <main class="layout">
      <section class="map-panel">
        <div class="map-toolbar">
          <button type="button" data-zoom="in" data-i18n-title="zoomIn" data-i18n-aria="zoomIn">+</button>
          <button type="button" data-zoom="out" data-i18n-title="zoomOut" data-i18n-aria="zoomOut">−</button>
          <button type="button" data-zoom="reset" data-i18n-title="zoomReset" data-i18n-aria="zoomReset">⤢</button>
        </div>
        <div class="message" data-message role="status" aria-live="polite"></div>
        <svg class="map" data-svg xmlns="http://www.w3.org/2000/svg">
          <g data-barris-group></g>
          <g data-districtes-group></g>
        </svg>
        <div class="map-footer-note" data-i18n="mapFooterNote"></div>
      </section>

      <aside class="list-panel">
        <div class="list-panel-header">
          <h2 data-i18n="h2SelectBarriName"></h2>
          <input class="filter-input" data-filter type="text" data-i18n-placeholder="filterPlaceholder" autocomplete="off">
          <div class="action-bar">
            <button class="submit-btn" data-submit type="button" disabled data-i18n="checkGuessBtn"></button>
            <div class="hint-text" data-hint></div>
          </div>
        </div>
        <div class="names-list" data-names-list></div>
      </aside>
    </main>
  </section>

  <section class="mode-panel" id="panel-medium" hidden>
    <div class="mode-header">
      <div class="mode-desc" data-i18n="descMediumBarri"></div>
      <div class="scoreboard">
        <div class="count"><span class="score-count">0</span><span class="slash">/</span><span class="score-total">73</span> <span data-i18n="placedLabel"></span></div>
        <div class="count errors"><span class="error-num">0</span> <span class="error-word"></span></div>
        <button class="reset-btn" type="button" data-reset="medium" data-i18n="resetProgressBtn"></button>
      </div>
    </div>

    <div class="completion-banner" data-banner="medium"></div>

    <main class="layout">
      <section class="map-panel">
        <div class="map-toolbar">
          <button type="button" data-zoom="in" data-i18n-title="zoomIn" data-i18n-aria="zoomIn">+</button>
          <button type="button" data-zoom="out" data-i18n-title="zoomOut" data-i18n-aria="zoomOut">−</button>
          <button type="button" data-zoom="reset" data-i18n-title="zoomReset" data-i18n-aria="zoomReset">⤢</button>
        </div>
        <div class="message" data-message role="status" aria-live="polite"></div>
        <svg class="map medium-map" data-svg xmlns="http://www.w3.org/2000/svg">
          <g data-barris-group></g>
          <g data-districtes-group></g>
        </svg>
        <div class="map-footer-note" data-i18n="mapFooterNote"></div>
      </section>

      <aside class="list-panel">
        <div class="list-panel-header">
          <h2 data-i18n="h2WhichBarriHighlighted"></h2>
          <input class="filter-input" data-filter type="text" data-i18n-placeholder="filterPlaceholder" autocomplete="off">
          <div class="action-bar">
            
            <div class="hint-text" data-hint></div>
          </div>
        </div>
        <div class="names-list" data-names-list></div>
      </aside>
    </main>
  </section>

  <section class="mode-panel" id="panel-location" hidden>
    <div class="mode-header">
      <div class="mode-desc" data-i18n="descLocationBarri"></div>
      <div class="scoreboard">
        <div class="count"><span class="score-count">0</span><span class="slash">/</span><span class="score-total">73</span> <span data-i18n="placedLabel"></span></div>
        <div class="count errors"><span class="error-num">0</span> <span class="error-word"></span></div>
        <button class="reset-btn" type="button" data-reset="location" data-i18n="resetProgressBtn"></button>
      </div>
    </div>

    <div class="completion-banner" data-banner="location"></div>

    <main class="layout">
      <section class="map-panel">
        <div class="map-toolbar">
          <button type="button" data-zoom="in" data-i18n-title="zoomIn" data-i18n-aria="zoomIn">+</button>
          <button type="button" data-zoom="out" data-i18n-title="zoomOut" data-i18n-aria="zoomOut">−</button>
          <button type="button" data-zoom="reset" data-i18n-title="zoomReset" data-i18n-aria="zoomReset">⤢</button>
        </div>
        <div class="message" data-message role="status" aria-live="polite"></div>
        <svg class="map" data-svg xmlns="http://www.w3.org/2000/svg">
          <g data-barris-group></g>
          <g data-districtes-group></g>
        </svg>
        <div class="map-footer-note" data-i18n="mapFooterNote"></div>
      </section>

      <aside class="list-panel">
        <div class="list-panel-header">
          <h2 data-i18n="h2HighlightedName"></h2>
          <input class="filter-input" data-filter type="text" data-i18n-placeholder="filterPlaceholder" autocomplete="off">
          <div class="action-bar">
            
            <div class="hint-text" data-hint></div>
          </div>
        </div>
        <div class="names-list" data-names-list></div>
      </aside>
    </main>
  </section>

  <section class="mode-panel" id="panel-hard-name" hidden>
    <div class="mode-header">
      <div class="mode-desc" data-i18n="descHardName"></div>
      <div class="scoreboard">
        <div class="count"><span class="score-count">0</span><span class="slash">/</span><span class="score-total">73</span> <span data-i18n="placedLabel"></span></div>
        <div class="count errors"><span class="error-num">0</span> <span class="error-word"></span></div>
        <button class="reset-btn" type="button" data-reset="hard-name" data-i18n="resetProgressBtn"></button>
      </div>
    </div>

    <div class="completion-banner" data-banner="hard-name"></div>

    <main class="layout">
      <section class="map-panel">
        <div class="map-toolbar">
          <button type="button" data-zoom="in" data-i18n-title="zoomIn" data-i18n-aria="zoomIn">+</button>
          <button type="button" data-zoom="out" data-i18n-title="zoomOut" data-i18n-aria="zoomOut">−</button>
          <button type="button" data-zoom="reset" data-i18n-title="zoomReset" data-i18n-aria="zoomReset">⤢</button>
        </div>
        <div class="message" data-message role="status" aria-live="polite"></div>
        <svg class="map medium-map" data-svg xmlns="http://www.w3.org/2000/svg">
          <g data-barris-group></g>
          <g data-districtes-group></g>
        </svg>
        <div class="map-footer-note" data-i18n="mapFooterNote"></div>
      </section>

      <aside class="list-panel">
        <div class="list-panel-header">
          <h2 data-i18n="h2WhichBarriHighlighted"></h2>
          <input class="filter-input" data-filter type="text" data-i18n-placeholder="filterPlaceholder" autocomplete="off">
          <div class="action-bar">
            
            <div class="hint-text" data-hint></div>
          </div>
        </div>
        <div class="names-list" data-names-list></div>
      </aside>
    </main>
  </section>

  <section class="mode-panel" id="panel-hard-location" hidden>
    <div class="mode-header">
      <div class="mode-desc" data-i18n="descHardLocation"></div>
      <div class="scoreboard">

    "hintFindLocationBarri": "Troba al mapa la ubicació del nom ressaltat.",
    "hintFindLocationDistrict": "Troba al mapa el districte del nom ressaltat.",
    "msgWrongEasy": "Resposta incorrecta — prova amb un altre nom o zona.",
    "msgWrongNewNameBarri": "Resposta incorrecta — es ressaltarà un nou barri.",
    "msgWrongNewNameDistrict": "Resposta incorrecta — es ressaltarà un nou districte.",
    "msgWrongNewLocation": "Resposta incorrecta — es ressaltarà un nou nom.",
    "completionLabelBarri": "barris oficials",
    "completionLabelDistrict": "districtes",
    "completionPerfect": "Perfecte!",
    "completionWellDone": "Bon treball!"
  }
};

// Function-valued i18n entries need actual JS closures (interpolation +
// per-language phrasing), so they're added after the plain-string I18N
// object rather than living inside the JSON-like literal above.
I18N.en.msgCorrect = (name) => `Correct — ${name}.`;
I18N.es.msgCorrect = (name) => `Correcto — ${name}.`;
I18N.fr.msgCorrect = (name) => `Correct — ${name}.`;
I18N.ca.msgCorrect = (name) => `Correcte — ${name}.`;

I18N.en.completionText = (count, label, errors, errorWord, closing) =>
  `You've placed all ${count} ${label}, with ${errors} ${errorWord}. ${closing}`;
I18N.es.completionText = (count, label, errors, errorWord, closing) =>
  `Has colocado los ${count} ${label}, con ${errors} ${errorWord}. ${closing}`;
I18N.fr.completionText = (count, label, errors, errorWord, closing) =>
  `Vous avez placé les ${count} ${label}, avec ${errors} ${errorWord}. ${closing}`;
I18N.ca.completionText = (count, label, errors, errorWord, closing) =>
  `Has col·locat els ${count} ${label}, amb ${errors} ${errorWord}. ${closing}`;

let currentLang = 'en';
function t(key, ...args){
  const entry = (I18N[currentLang] && I18N[currentLang][key] !== undefined)
    ? I18N[currentLang][key]
    : I18N.en[key];
  return (typeof entry === 'function') ? entry(...args) : entry;
}

function applyStaticTranslations(){
  document.documentElement.lang = currentLang;
  document.title = t('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => {
    el.setAttribute('aria-label', t(el.dataset.i18nAria));
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.setAttribute('title', t(el.dataset.i18nTitle));
  });
  const h1 = document.getElementById('appTitle');
  if (h1) h1.innerHTML = `${t('title')} <em>${t('cityName')}</em>`;
}


(function(){

  function sortKey(name){
    return name.replace(/^(el |la |els |les |l')/,'').toLocaleLowerCase('ca');
  }

  const gameInstances = [];

  // ---------------------------------------------------------------
  // Builds one independent game instance (map + list + scoring)
  // inside the given panel element.
  // ---------------------------------------------------------------
  function buildGame(panel, mode, granularity){
    const isDistrict = granularity === 'district';
    const svg = panel.querySelector('[data-svg]');
    const barrisGroup = panel.querySelector('[data-barris-group]');
    const districtesGroup = panel.querySelector('[data-districtes-group]');
    const namesList = panel.querySelector('[data-names-list]');
    const messageEl = panel.querySelector('[data-message]');
    const hintEl = panel.querySelector('[data-hint]');
    const filterInput = panel.querySelector('[data-filter]');
    const scoreCountEl = panel.querySelector('.score-count');
    const scoreTotalEl = panel.querySelector('.score-total');
    const errorNumEl = panel.querySelector('.error-num');
    const errorWordEl = panel.querySelector('.error-word');
    const resetBtn = panel.querySelector('[data-reset]');
    const completionBanner = panel.querySelector('[data-banner]');
    const submitBtn = mode === 'easy' ? panel.querySelector('[data-submit]') : null;

    const W = BCN_DATA.width, H = BCN_DATA.height;
    const baseVB = {x:0, y:0, w:W, h:H};
    let vb = {...baseVB};
    svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    svg.style.setProperty('--asp', `${W} / ${H}`);

    // ---- build map (always at barri resolution — districts are just a
    // grouping of these same shapes, the map itself never changes) ----
    const barriById = {};
    BCN_DATA.barris.forEach(b => {
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d', b.path);
      p.setAttribute('class','barri');
      p.dataset.id = b.id;
      p.dataset.name = b.name;
      barrisGroup.appendChild(p);
      barriById[b.id] = { ...b, el: p };
    });
    BCN_DATA.districtes.forEach(d => {
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d', d.path);
      p.setAttribute('class','district');
      districtesGroup.appendChild(p);
    });

    // ---- "units": the things being guessed. In barri games each unit is
    // one neighbourhood (one path). In district games each unit is a
    // whole district (a cluster of barri paths that highlight together,
    // since clicking any of them selects the whole district). ----
    const unitList = isDistrict
      ? BCN_DATA.districtes.map(d => ({id:d.id, name:d.name}))
      : BCN_DATA.barris.map(b => ({id:b.id, name:b.name}));
    const unitById = {};
    unitList.forEach(u => { unitById[u.id] = { id:u.id, name:u.name, solved:false, els:[] }; });
    BCN_DATA.barris.forEach(b => {
      const uid = isDistrict ? b.district : b.id;
      unitById[uid].els.push(barriById[b.id].el);
    });
    function unitIdForBarri(barriId){
      return isDistrict ? barriById[barriId].district : barriId;
    }
    scoreTotalEl.textContent = unitList.length;

    // ---- build name list ----
    const sortedUnits = [...unitList].sort((a,b) => sortKey(a.name).localeCompare(sortKey(b.name), 'ca'));
    const nameBtnByName = {};
    const nameOrder = {};
    sortedUnits.forEach((u, idx) => {
      const btn = document.createElement('button');
      btn.className = 'name-btn';
      btn.type = 'button';
      btn.textContent = u.name;
      btn.dataset.name = u.name;
      btn.style.order = idx;
      btn.addEventListener('click', () => onNameClick(u.name));
      namesList.appendChild(btn);
      nameBtnByName[u.name] = btn;
      nameOrder[u.name] = idx;
    });
    if (mode === 'location' || mode === 'hard-location') namesList.classList.add('readonly');

    function stripAccents(s){
      return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }
    filterInput.addEventListener('input', () => {
      const q = stripAccents(filterInput.value.trim().toLocaleLowerCase('ca'));
      Object.entries(nameBtnByName).forEach(([name, btn]) => {
        btn.classList.toggle('hidden-filter', !stripAccents(name.toLocaleLowerCase('ca')).includes(q));
      });
    });
    function resetFilter(){
      filterInput.value = '';
      Object.values(nameBtnByName).forEach(btn => btn.classList.remove('hidden-filter'));
    }

    // ---- shared state ----
    let solvedCount = 0;
    let errorCount = 0;
    let selectedZoneId = null;   // easy mode: user-picked unit id
    let selectedName = null;     // easy mode: user-picked name
    let lastGuessBlocked = false;
    let targetId = null;         // medium/location/hard modes: game-picked unit id
    let solvedOrderCounter = unitList.length; // next append slot for solved names

    // 'medium' & 'hard-name' highlight a unit, you find its name.
    // 'location' & 'hard-location' highlight a name, you find its unit.
    // 'hard-*' modes never leave a persistent highlight after a correct guess.
    const nameMode = (mode === 'medium' || mode === 'hard-name');
    const locationMode = (mode === 'location' || mode === 'hard-location');
    const hard = (mode === 'hard-name' || mode === 'hard-location');

    function updateErrorDisplay(){
      errorNumEl.textContent = errorCount;
      errorWordEl.textContent = errorCount === 1 ? t('errorSingular') : t('errorPlural');
    }

    function showMessage(text, kind){
      messageEl.textContent = text;
      messageEl.className = 'message show ' + kind;
      clearTimeout(showMessage._t);
      showMessage._t = setTimeout(() => messageEl.classList.remove('show'), 2600);
    }

    function markSolved(unit){
      unit.solved = true;
      solvedCount++;
      scoreCountEl.textContent = solvedCount;
      const btn = nameBtnByName[unit.name];
      unit.els.forEach(el => el.classList.remove('selected'));
      btn.classList.remove('selected');
      if (!hard){
        // soft modes (easy / medium / location): leave a permanent green
        // marker, lock the name, and bump it to the end of the list so
        // unsolved options always stay at the top.
        unit.els.forEach(el => el.classList.add('solved'));
        btn.classList.add('solved');
        btn.disabled = true;
        btn.style.order = solvedOrderCounter++;
      }
      // hard modes: no lasting mark anywhere, and no reordering — the
      // unit/name stay fully interactive in their normal spot, they just
      // won't be picked as a target again.
    }

    function completionLabel(){
      return isDistrict ? t('completionLabelDistrict') : t('completionLabelBarri');
    }
    function updateCompletionBannerText(){
      const closing = errorCount === 0 ? t('completionPerfect') : t('completionWellDone');
      const errorWord = errorCount === 1 ? t('errorSingular') : t('errorPlural');
      completionBanner.textContent = t('completionText', unitList.length, completionLabel(), errorCount, errorWord, closing);
    }
    function checkCompletion(){
      if (solvedCount === unitList.length){
        updateCompletionBannerText();
        completionBanner.classList.add('show');
        return true;
      }
      return false;
    }

    // ===================== EASY MODE LOGIC =====================
    function onZoneClickEasy(barriId){
      const uid = unitIdForBarri(barriId);
      const unit = unitById[uid];
      if (unit.solved) return;
      selectedZoneId = (selectedZoneId === uid) ? null : uid;
      lastGuessBlocked = false;
      messageEl.classList.remove('show');
      renderEasy();
    }
    function onNameClickEasy(name){
      if (nameBtnByName[name].classList.contains('solved')) return;
      selectedName = (selectedName === name) ? null : name;
      lastGuessBlocked = false;
      messageEl.classList.remove('show');
      renderEasy();
    }
    function renderEasy(){
      unitList.forEach(u => {
        const unit = unitById[u.id];
        unit.els.forEach(el => {
          if (unit.solved){
            el.classList.add('solved');
            el.classList.remove('selected');
          } else {
            el.classList.toggle('selected', unit.id === selectedZoneId);
          }
        });
      });
      Object.entries(nameBtnByName).forEach(([name, btn]) => {
        if (btn.classList.contains('solved')) return;
        btn.classList.toggle('selected', name === selectedName);
      });
      submitBtn.disabled = !(selectedZoneId && selectedName) || lastGuessBlocked;
      hintEl.textContent = selectedZoneId && selectedName
        ? t('hintReady')
        : (isDistrict ? t('hintEasyDefaultDistrict') : t('hintEasyDefaultBarri'));
    }
    if (mode === 'easy'){
      submitBtn.addEventListener('click', () => {
        if (!selectedZoneId || !selectedName) return;
        resetFilter();
        const unit = unitById[selectedZoneId];
        if (unit.name === selectedName){
          markSolved(unit);
          showMessage(t('msgCorrect', unit.name), 'correct');
          selectedZoneId = null;
          selectedName = null;
          lastGuessBlocked = false;
          checkCompletion();
        } else {
          showMessage(t('msgWrongEasy'), 'wrong');
          unit.els.forEach(el => el.classList.add('wrong-flash'));
          setTimeout(() => unit.els.forEach(el => el.classList.remove('wrong-flash')), 500);
          lastGuessBlocked = true;
          errorCount++;
          updateErrorDisplay();
        }
        renderEasy();
      });
    }

    // ========== SHARED "TARGET" LOGIC (medium / location / hard-*) ==========
    function pickTarget(excludeId){
      const remaining = unitList.filter(u => !unitById[u.id].solved && u.id !== excludeId);
      const pool = remaining.length ? remaining : unitList.filter(u => !unitById[u.id].solved);
      if (!pool.length){ targetId = null; return; }
      targetId = pool[Math.floor(Math.random() * pool.length)].id;
    }
    function highlightTarget(){
      unitList.forEach(u => {
        const unit = unitById[u.id];
        if (!unit.solved) unit.els.forEach(el => el.classList.remove('selected'));
      });
      Object.entries(nameBtnByName).forEach(([name, btn]) => {
        if (!btn.classList.contains('solved')){
          btn.classList.remove('selected');
          btn.style.order = nameOrder[name];
        }
      });
      if (targetId === null) return;
      const unit = unitById[targetId];
      if (nameMode){
        unit.els.forEach(el => el.classList.add('selected'));
        hintEl.textContent = isDistrict ? t('hintFindNameDistrict') : t('hintFindNameBarri');
      } else if (locationMode){
        const targetBtn = nameBtnByName[unit.name];
        targetBtn.classList.add('selected');
        targetBtn.style.order = -1;
        hintEl.textContent = isDistrict ? t('hintFindLocationDistrict') : t('hintFindLocationBarri');
      }
    }
    function onCorrectTarget(unit){
      markSolved(unit);
      showMessage(t('msgCorrect', unit.name), 'correct');
      if (!checkCompletion()){
        pickTarget(unit.id);
        highlightTarget();
      } else {
        targetId = null;
      }
    }
    function onWrongTarget(flashUnit, nextMessage){
      showMessage(nextMessage, 'wrong');
      flashUnit.els.forEach(el => el.classList.add('wrong-flash'));
      setTimeout(() => flashUnit.els.forEach(el => el.classList.remove('wrong-flash')), 500);
      errorCount++;
      updateErrorDisplay();
      pickTarget(targetId);
      highlightTarget();
    }

    // ================ FIND-NAME LOGIC (medium / hard-name) =================
    function onNameClickTarget(name){
      if (targetId === null) return;
      if (nameBtnByName[name].classList.contains('solved')) return;
      resetFilter();
      const unit = unitById[targetId];
      if (unit.name === name){
        onCorrectTarget(unit);
      } else {
        onWrongTarget(unit, isDistrict ? t('msgWrongNewNameDistrict') : t('msgWrongNewNameBarri'));
      }
    }

    // ============= FIND-LOCATION LOGIC (location / hard-location) ==========
    function onZoneClickTarget(barriId){
      if (targetId === null) return;
      const uid = unitIdForBarri(barriId);
      const clickedUnit = unitById[uid];
      if (clickedUnit.solved && !hard) return;
      resetFilter();
      if (uid === targetId){
        onCorrectTarget(clickedUnit);
      } else {
        onWrongTarget(clickedUnit, t('msgWrongNewLocation'));
      }
    }

    function onNameClick(name){
      if (mode === 'easy') onNameClickEasy(name);
      else if (nameMode) onNameClickTarget(name);
      // location modes: names are a clue only, not clickable targets.
    }
    function onZoneClick(barriId){
      if (mode === 'easy') onZoneClickEasy(barriId);
      else if (locationMode) onZoneClickTarget(barriId);
      // name modes: zones are a clue only, not clickable targets.
    }

    // ===================== zoom & pan (per instance) =====================
    function clampVB(v){
      let w = Math.min(baseVB.w, Math.max(baseVB.w/6, v.w));
      let h = w * (baseVB.h/baseVB.w);
      let x = v.x, y = v.y;
      x = Math.min(baseVB.x + baseVB.w - w, Math.max(baseVB.x, x));
      y = Math.min(baseVB.y + baseVB.h - h, Math.max(baseVB.y, y));
      if (w >= baseVB.w){ x = baseVB.x; }
      if (h >= baseVB.h){ y = baseVB.y; }
      return {x,y,w,h};
    }
    function applyVB(){ svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
    function screenToSVG(clientX, clientY){
      const pt = svg.createSVGPoint();
      pt.x = clientX; pt.y = clientY;
      return pt.matrixTransform(svg.getScreenCTM().inverse());
    }
    function zoomAt(factor, clientX, clientY){
      const before = screenToSVG(clientX, clientY);
      let newW = vb.w * factor;
      let newH = newW * (baseVB.h/baseVB.w);
      let newX = before.x - (before.x - vb.x) * (newW/vb.w);
      let newY = before.y - (before.y - vb.y) * (newH/vb.h);
      vb = clampVB({x:newX, y:newY, w:newW, h:newH});
      applyVB();
    }
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoomAt(e.deltaY > 0 ? 1.12 : 1/1.12, e.clientX, e.clientY);
    }, {passive:false});
    panel.querySelector('[data-zoom="in"]').addEventListener('click', () => {
      const r = svg.getBoundingClientRect();
      zoomAt(1/1.35, r.left + r.width/2, r.top + r.height/2);
    });
    panel.querySelector('[data-zoom="out"]').addEventListener('click', () => {
      const r = svg.getBoundingClientRect();
      zoomAt(1.35, r.left + r.width/2, r.top + r.height/2);
    });
    panel.querySelector('[data-zoom="reset"]').addEventListener('click', () => {
      vb = {...baseVB};
      applyVB();
    });

    // Click-vs-drag detection (setPointerCapture retargets the native
    // 'click' event to the svg, so we detect taps ourselves).
    const CLICK_MOVE_THRESHOLD = 6;
    let dragging = false, dragStart = null, vbStart = null, pointerMoved = false, downZoneEl = null;
    svg.addEventListener('pointerdown', (e) => {
      dragging = true;
      pointerMoved = false;
      dragStart = {x:e.clientX, y:e.clientY};
      vbStart = {...vb};
      downZoneEl = e.target.closest('.barri');
      svg.classList.add('dragging');
      svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const totalDx = e.clientX - dragStart.x;
      const totalDy = e.clientY - dragStart.y;
      if (Math.hypot(totalDx, totalDy) > CLICK_MOVE_THRESHOLD) pointerMoved = true;
      const r = svg.getBoundingClientRect();
      const scaleX = vb.w / r.width;
      const scaleY = vb.h / r.height;
      vb = clampVB({x: vbStart.x - totalDx*scaleX, y: vbStart.y - totalDy*scaleY, w: vbStart.w, h: vbStart.h});
      applyVB();
    });
    function endDrag(){
      if (dragging && !pointerMoved && downZoneEl){
        onZoneClick(downZoneEl.dataset.id);
      }
      dragging = false;
      downZoneEl = null;
      svg.classList.remove('dragging');
    }
    svg.addEventListener('pointerup', endDrag);
    svg.addEventListener('pointerleave', () => { dragging = false; downZoneEl = null; svg.classList.remove('dragging'); });

    // ---- reset ----
    function reset(){
      unitList.forEach(u => {
        const unit = unitById[u.id];
        unit.solved = false;
        unit.els.forEach(el => el.classList.remove('solved','selected'));
      });
      Object.entries(nameBtnByName).forEach(([name, btn]) => {
        btn.classList.remove('solved','selected');
        btn.disabled = false;
        btn.style.order = nameOrder[name];
      });
      solvedOrderCounter = unitList.length;
      selectedZoneId = null;
      selectedName = null;
      solvedCount = 0;
      errorCount = 0;
      lastGuessBlocked = false;
      scoreCountEl.textContent = 0;
      updateErrorDisplay();
      completionBanner.classList.remove('show');
      messageEl.classList.remove('show');
      if (mode === 'easy'){
        renderEasy();
      } else {
        pickTarget(null);
        highlightTarget();
      }
    }
    resetBtn.addEventListener('click', () => {
      if ((solvedCount > 0 || errorCount > 0) && !confirm(t('resetConfirm'))) return;
      reset();
    });

    // ---- language change: re-render whatever dynamic text is showing,
    // in the newly selected language, without touching game progress ----
    function refreshTexts(){
      updateErrorDisplay();
      if (completionBanner.classList.contains('show')) updateCompletionBannerText();
      if (mode === 'easy'){
        renderEasy();
      } else {
        highlightTarget();
      }
    }

    // ---- init ----
    updateErrorDisplay();
    if (mode === 'easy'){
      renderEasy();
    } else {
      pickTarget(null);
      highlightTarget();
    }

    const instance = { reset, refreshTexts };
    gameInstances.push(instance);
    return instance;
  }


  const easyGame = buildGame(document.getElementById('panel-easy'), 'easy', 'barri');
  const mediumGame = buildGame(document.getElementById('panel-medium'), 'medium', 'barri');
  const locationGame = buildGame(document.getElementById('panel-location'), 'location', 'barri');
  const hardNameGame = buildGame(document.getElementById('panel-hard-name'), 'hard-name', 'barri');
  const hardLocationGame = buildGame(document.getElementById('panel-hard-location'), 'hard-location', 'barri');

  const districtEasyGame = buildGame(document.getElementById('panel-district-easy'), 'easy', 'district');
  const districtMediumGame = buildGame(document.getElementById('panel-district-medium'), 'medium', 'district');
  const districtLocationGame = buildGame(document.getElementById('panel-district-location'), 'location', 'district');
  const districtHardNameGame = buildGame(document.getElementById('panel-district-hard-name'), 'hard-name', 'district');
  const districtHardLocationGame = buildGame(document.getElementById('panel-district-hard-location'), 'hard-location', 'district');

  // ---- mode tab switching ----
  const tabs = document.querySelectorAll('.mode-tab');
  const panels = {
    easy: document.getElementById('panel-easy'),
    medium: document.getElementById('panel-medium'),
    location: document.getElementById('panel-location'),
    'hard-name': document.getElementById('panel-hard-name'),
    'hard-location': document.getElementById('panel-hard-location'),
    'district-easy': document.getElementById('panel-district-easy'),
    'district-medium': document.getElementById('panel-district-medium'),
    'district-location': document.getElementById('panel-district-location'),
    'district-hard-name': document.getElementById('panel-district-hard-name'),
    'district-hard-location': document.getElementById('panel-district-hard-location')
  };
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.toggle('active', t === tab));
      Object.entries(panels).forEach(([m, el]) => { el.hidden = (m !== tab.dataset.mode); });
      closeModeMenu();
    });
  });

  // ---- burger menu (mobile / tablet) ----
  const burgerBtn = document.getElementById('burgerBtn');
  const modeTabsWrapper = document.getElementById('modeTabsWrapper');
  function closeModeMenu(){
    modeTabsWrapper.classList.remove('open');
    burgerBtn.setAttribute('aria-expanded', 'false');
  }
  function toggleModeMenu(){
    const open = modeTabsWrapper.classList.toggle('open');
    burgerBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  burgerBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleModeMenu();
  });
  document.addEventListener('click', (e) => {
    if (!modeTabsWrapper.classList.contains('open')) return;
    if (modeTabsWrapper.contains(e.target) || burgerBtn.contains(e.target)) return;
    closeModeMenu();
  });
  window.addEventListener('resize', () => {
    if (window.innerWidth > 880) closeModeMenu();
  });

  // ---- language selector ----
  const langSelect = document.getElementById('langSelect');
  function setLanguage(lang){
    if (!I18N[lang]) return;
    currentLang = lang;
    applyStaticTranslations();
    gameInstances.forEach(g => g.refreshTexts());
  }
  langSelect.addEventListener('change', () => setLanguage(langSelect.value));

  applyStaticTranslations();

})();
</script>

</body>
